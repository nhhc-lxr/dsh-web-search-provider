# dsh bundle patch: mounts the provider pair and pins them on the `web` row.
#
# `insert` mounts this package's own Host row. The second entry targets the
# existing `web` row (owned by @deepseek-ai/dsh-web) and replaces its whole
# `config` — `config` is never deep-merged, so both ids are restated here.
#
# The pinned ids never change: `web-tool` is one provider per capability, and it
# dispatches to tavily / exa / firecrawl according to `searchBackend` and
# `fetchBackend` below. Switching backends therefore does not touch this file —
# the settings page writes those two fields through the config editor.
- insert:
    - id: web-tool-provider
      name: 'dsh-web-tool-provider'
      config:
        searchBackend: tavily
        fetchBackend: firecrawl
        fallbackToHttp: true

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: web-tool
    fetchProvider: web-tool
